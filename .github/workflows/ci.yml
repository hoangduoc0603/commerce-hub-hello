# CI của hello: build, test, image, quét, push GHCR. Toàn bộ logic nằm trong reusable workflow java-service.yml của
# platform; file này chỉ chọn sự kiện và cấp quyền. Chuẩn: docs/standards/ci-cd.md (repo docs).
name: ci

on:
  # Push vào main: build, quét rồi push ghcr.io/<owner>/commerce-hub-hello:<sha>, gửi dependency graph.
  push:
    branches: [main]
  # PR: chỉ build và quét, không push, token không có packages: write.
  pull_request:
  # Quét lại hằng tuần với DB Trivy mới (G0-23 Q10). Không push: base ghim digest nên build lại không nhận bản vá;
  # bản vá đến qua PR Dependabot đổi digest. Giờ lẻ để tránh giờ chẵn đông runner.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# PR: chung một nhóm theo ref, lần chạy mới hủy lần cũ. Sự kiện khác (push vào main, schedule, workflow_dispatch):
# mỗi lần chạy một nhóm riêng (run_id), không xếp hàng. Lý do (review G0-23): một nhóm chỉ giữ MỘT lần chạy đang
# chờ, lần mới tới sẽ hủy lần đang chờ kể cả khi cancel-in-progress là false; dùng chung nhóm theo ref thì lần chạy
# theo lịch hoặc push kế tiếp hủy lần push đang chờ, commit đó không bao giờ có image.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Ghim SHA 40 ký tự của commit release, comment là tên release (ci-cd.md, "Reusable workflow cho polyrepo").
    uses: hoangduoc0603/commerce-hub-platform/.github/workflows/java-service.yml@2a3105b2f469c20a34fc581abc8963f61fa0aec0 # v0.3.1
    # Mức trần; từng job bên trong tự hạ. contents: write chỉ cho job dependency-graph trên main.
    permissions:
      contents: write
      packages: write
      security-events: write
    with:
      image: commerce-hub-hello

  # Deploy lên lab qua GitOps: ghi digest vừa push vào repo gitops, Argo CD trên lab tự kéo về.
  # CI không có token Argo CD, không gọi kubectl (ci-cd.md, "Deploy qua GitOps"). Ticket G0-24.
  deploy:
    needs: ci
    # Chỉ push vào nhánh mặc định VÀ đã có image. digest rỗng khi container-image.yml không push (PR, schedule,
    # workflow_dispatch). Hai điều kiện trùng ý, giữ cả hai để đọc là hiểu (ci-cd.md, "Repo public": job cập nhật
    # gitops chỉ chạy khi github.event_name == 'push' trên nhánh mặc định).
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.ci.outputs.digest != ''
    # Hàng đợi (concurrency update-gitops-lab, queue: max) nằm trong job của workflow được gọi.
    uses: hoangduoc0603/commerce-hub-platform/.github/workflows/update-gitops.yml@2a3105b2f469c20a34fc581abc8963f61fa0aec0 # v0.3.1
    # Chỉ đọc compare API của repo này. Quyền ghi gitops nằm ở token GitHub App, không ở GITHUB_TOKEN.
    permissions:
      contents: read
    with:
      # Tên thư mục trong gitops/envs/lab/. Môi trường mặc định là lab.
      service: hello
      digest: ${{ needs.ci.outputs.digest }}
      # Không bí mật: variable của repo (G0-24 bước 1).
      client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
    # Truyền tường minh, không secrets: inherit: workflow chung chỉ nhận đúng secret nó cần.
    secrets:
      app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
