; PgBouncer cho test, mô phỏng Pooler pg-main-pooler-rw (gitops/infra/pg-main/pooler.yaml).
; Trên lab, operator CNPG sinh file này (pkg/management/pgbouncer/config/config.go, tag v1.30.1).
; Đổi pooler.yaml thì đổi file này cùng lúc.

[databases]
; "postgres" là network alias của container PostgreSQL trong TestcontainersConfiguration.
; Operator sinh "* = host=pg-main-rw" cho mọi database; ở đây chỉ cần database hello.
hello = host=postgres port=5432 dbname=hello

[pgbouncer]
listen_addr = 0.0.0.0
; Lab nghe 5432 (operator ép). Test dùng 6432, cổng mặc định của image; host vẫn nhận cổng ngẫu nhiên.
listen_port = 6432
; Giống poolMode của Pooler lab.
pool_mode = transaction

; LỆCH LAB: lab dùng auth_type hba cùng auth_query qua role cnpg_pooler_pgbouncer với client cert.
; Test dùng file mật khẩu: docs PgBouncer cho phép mật khẩu plaintext với scram-sha-256, và PgBouncer dùng
; chính mật khẩu đó để đăng nhập PostgreSQL bằng SCRAM.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Ba tham số giống parameters của pooler.yaml (lý do ghi ở file đó).
default_pool_size = 8
server_login_retry = 2
; Operator đặt mặc định này, comment trong code: cần để libpq kết nối được (lib/pq#475).
ignore_startup_parameters = extra_float_digits,options

; LỆCH LAB: không TLS. Lab có client_tls_sslmode require, server_tls_sslmode verify-ca, đã kiểm ở G0-08.
; Test chỉ kiểm hành vi của pool; dựng CA cho test là chi phí mà không đổi kết quả.

; Không đặt max_prepared_statements: mặc định 200 (docs 1.25.2) và operator cũng không đặt, nên giống lab.
