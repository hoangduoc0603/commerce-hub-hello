# Chỉ có trên classpath test (cả ./gradlew test lẫn bootTestRun ở bước 8). Boot đọc classpath:/config/application.yaml
# SAU classpath:/application.yaml, nên giá trị ở đây đè giá trị trong src/main.
#
# Vì sao không đặt trong DynamicPropertyRegistrar như url/user/password: Boot quyết định có bật FlywayAutoConfiguration
# hay không (điều kiện spring.flyway.enabled) TRƯỚC khi các registrar chạy. Đã thử: đặt ở registrar thì Flyway
# không chạy, cũng không có dòng log nào báo.
#
# Không đặt tên src/test/resources/application.yaml: file cùng tên che mất application.yaml của src/main.
spring:
  flyway:
    enabled: true

  # G0-29. Địa chỉ giả: .test là TLD dành riêng (RFC 2606), không bao giờ phân giải được, nên lỡ có request thật thì
  # lỗi ngay chứ không đi ra Internet. Decoder tải JWKS lười (lúc giải mã token đầu tiên), nên khởi động không gọi
  # tới đây. Phải đặt ở file này, không trong registrar: bean JwtDecoder có điều kiện @ConditionalOnJwkSetUriJwtDecoder,
  # đánh giá trước registrar (cùng bẫy với spring.flyway.enabled ở trên).
  security:
    oauth2:
      resourceserver:
        jwt:
          # Có cả hai thì Boot tải khóa từ jwk-set-uri và vẫn thêm JwtIssuerValidator so iss với issuer-uri.
          issuer-uri: https://auth.test/realms/commerce-hub
          jwk-set-uri: https://auth.test/realms/commerce-hub/protocol/openid-connect/certs
