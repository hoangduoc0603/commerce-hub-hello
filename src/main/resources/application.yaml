spring:
  application:
    name: hello

  # Resource server (G0-29). Chuẩn: docs/standards/keycloak.md mục "Resource server" (repo docs).
  # issuer-uri và jwk-set-uri KHÔNG đặt ở đây: địa chỉ Keycloak đổi theo môi trường (lab: env trong values gitops;
  # test: src/test/resources/config/application.yaml). Thiếu cả hai thì không có bean JwtDecoder và SecurityConfig
  # lỗi lúc khởi động: thà không chạy còn hơn chạy với địa chỉ sai rồi trả 401 cho mọi request.
  security:
    oauth2:
      resourceserver:
        jwt:
          # Boot thêm JwtClaimValidator trên claim aud: token phải có commerce-hub-api trong aud. Thiếu dòng này thì
          # token Keycloak phát cho client khác cùng realm (aud: account) vẫn lọt qua, vì cùng khóa ký và cùng iss.
          audiences: commerce-hub-api
          # Mặc định của Boot đã là RS256; ghi rõ để thấy danh sách thuật toán được phép. Token ký bằng thuật toán
          # khác (HS256, none) bị từ chối trước khi kiểm chữ ký.
          jws-algorithms: RS256

  # Migration (G0-26). Chuẩn: docs/standards/db-migration.md (repo docs).
  flyway:
    # Runtime KHÔNG migrate: pod chỉ có credential hello_app (không có quyền DDL). Chỉ profile migrate (Job PreSync,
    # ticket 27) và test bật Flyway. Mặc định tắt nên quên cấu hình thì không có gì xảy ra; nếu mặc định bật mà quên
    # tắt, Flyway sẽ thử migrate bằng hello_app.
    enabled: false
    # Mặc định của Boot là false: file đặt sai tên bị bỏ qua mà không báo gì. Bật để sai tên là lỗi.
    validate-migration-naming: true
    # Mặc định false: gõ sai đường dẫn thư mục migration thì Flyway không chạy gì mà vẫn báo thành công.
    fail-on-missing-locations: true
    postgresql:
      # Dùng advisory lock cấp session thay cho lock trong transaction: lock trong transaction gây lỗi với
      # CREATE INDEX CONCURRENTLY. Lock cấp session là lý do Flyway phải nối thẳng PostgreSQL, không qua PgBouncer.
      transactional-lock: false
    # Chạy trên mỗi kết nối Flyway mở, trước mọi migration. Boot nối các phần tử thành MỘT chuỗi SQL, nên mỗi câu
    # phải tự kết thúc bằng dấu ";" (đã thử: thiếu thì lỗi "syntax error at or near SET").
    init-sqls:
      # Chờ khóa tối đa 5 s rồi lỗi, thay vì chờ mãi và chặn mọi truy vấn xếp hàng phía sau.
      - SET lock_timeout = '5s';
      # Object mới thuộc hello_owner (NOLOGIN), không thuộc hello_migrator (đăng nhập được).
      - SET ROLE hello_owner;

  # Problem Details luôn tiếng Anh (docs/standards/rest-api.md). Mặc định Spring lấy locale từ Accept-Language và
  # Hibernate Validator dịch message theo đó: đã thấy "Größe muss zwischen 1 und 50 sein" khi gửi
  # Accept-Language: de. fixed: bỏ qua header, mọi request dùng locale en.
  web:
    locale: en
    locale-resolver: fixed

  threads:
    virtual:
      enabled: true

management:
  tracing:
    export:
      otlp:
        # Không gửi span tới Collector cho tới G0-30. KHÔNG dùng management.tracing.export.enabled: Boot 4.1 ghi
        # property đó là "export and propagate"; đặt false thì traceparent gửi vào bị bỏ qua (đã đo, G0-28).
        enabled: false
  otlp:
    metrics:
      export:
        # Starter kéo theo OtlpMeterRegistry, đẩy metric tới localhost:4318 mỗi phút và log ConnectException.
        # Metric đi đường Prometheus scrape (observability.md), nên tắt hẳn, không chỉ tới G0-30.
        enabled: false
  server:
    port: 8081
  endpoint:
    health:
      probes:
        add-additional-paths: true
