plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.hoangduoc0603.commercehub'
version = '0.0.1-SNAPSHOT'
description = 'hello'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Flyway (G0-26): migration có version, chạy bằng profile migrate (Job PreSync, ticket 27) và trong test.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // JDBC (G0-26): HikariCP, JdbcClient, JdbcTemplate, transaction. Không JPA: hello dùng JdbcClient (spec G0).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Driver pgjdbc; runtimeOnly vì code chỉ nói với DataSource, không import org.postgresql.*.
    // Flyway 10+ tách hỗ trợ từng loại DB ra module riêng; thiếu module này thì Flyway báo không hỗ trợ PostgreSQL.
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    // Test starter đi cùng starter (quy ước Boot 4).
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Container là @Bean, Spring Boot quản vòng đời; dùng lại được cho bootTestRun (bước 8).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Testcontainers 2.x (2.0.5 theo BOM Boot 4.1.2): artifact đổi tên thành testcontainers-<module>.
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Lệch mặc định Initializr: tắt plain jar (hello-…-plain.jar) mà Boot plugin sinh cạnh fat jar.
// Service chỉ chạy bằng fat jar; có hai file thì Dockerfile `COPY build/libs/*.jar` khớp 2 file.
tasks.named('jar') {
    enabled = false
}
